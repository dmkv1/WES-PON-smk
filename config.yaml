samples_csv: "samples.csv"
outdir: "results"

telegram_bot_env: "~/.telegram_bot.env"  # Path to .telegram_bot.env file; leave empty to disable notifications
run_id: "pon"            # Human-readable label prepended to Telegram notifications

# Container images (pinned). Referenced per rule as config["containers"][...].
containers:
  gatk: "docker://broadinstitute/gatk:4.6.2.0"
  cnvkit: "docker://etal/cnvkit:0.9.13"

refs:
  genome_human: "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.fasta"
  refflat: "/mnt/data/NGS/refs/UCSC/refFlat.txt"
  # BQSR known sites — flat list; GATK resolves .idx/.tbi siblings automatically
  known_sites:
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.dbsnp138.vcf"
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.known_indels.vcf.gz"
    - "/mnt/data/NGS/refs/broad/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

# Keys here become the {probes} wildcard value in output filenames.
# Each probe type needs two BED files:
#   regions_bedfile  — used by GATK --intervals (the "Regions" BED from the kit)
#   coverage_bedfile — used by CNVkit target/antitarget derivation (the "Covered" BED,
#                      preprocessed to remove headers and non-standard lines)
probe_configs:
  SureSelectV6UTR:
    library_prep: "SureSelectV6UTR"
    regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V6UTR/S07604624_Regions.bed"
    coverage_bedfile: "/mnt/data/NGS/refs/CNVkit/V6_UTR/S07604624_Covered_noHeader.bed"
  SureSelectV8UTR:
    library_prep: "SureSelectV8UTR"
    regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V8UTR/S33613271_Regions.bed"
    coverage_bedfile: "/mnt/data/NGS/refs/CNVkit/V8_UTR/S33613271_Covered_noHeader.bed"

resources:
  threads: 16
  java_max_gb: 32
  java_min_gb: 8

params:
  fastp:
    detect_adapter_for_pe: true
  cnvkit:
    autobin:
      method: "hybrid"
      bp_per_bin: 100000
      target_min_size: 20
      target_max_size: 20000
      antitarget_min_size: 500
      antitarget_max_size: 500000

samples_csv: "samples.csv"
outdir: "results"

telegram_bot_env: "~/.telegram_bot.env"  # Path to .telegram_bot.env file; leave empty to disable notifications
run_id: "pon"            # Human-readable label prepended to Telegram notifications

# Container images (pinned). Referenced per rule as config["containers"][...].
containers:
  gatk: "docker://broadinstitute/gatk:4.6.2.0"
  cnvkit: "docker://etal/cnvkit:0.9.14"

refs:
  # Root directory bound into containers (APPTAINER_BIND/SINGULARITY_BIND, set
  # in the Snakefile); every path below must resolve under it.
  path: "/mnt/data/NGS/refs"
  genome_human: "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.fasta"
  refflat: "/mnt/data/NGS/refs/UCSC/refFlat.txt"
  # BQSR known sites — flat list; GATK resolves .idx/.tbi siblings automatically
  known_sites:
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.dbsnp138.vcf"
    - "/mnt/data/NGS/refs/broad/Homo_sapiens_assembly38.known_indels.vcf.gz"
    - "/mnt/data/NGS/refs/broad/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

# Keys here become the {probes} wildcard value in output filenames.
# Each probe type points at the original Agilent kit BED files (with their
# browser/track header lines — the GATK tools and mosdepth skip those; CNVkit's
# header is stripped in-rule):
#   covered_bedfile        — the "Covered" BED (regions covered by probes). This
#                            is the primary interval set: drives BQSR --intervals,
#                            mosdepth, Mutect2/GenomicsDBImport, CNVkit autobin,
#                            and the HsMetrics baits.
#   target_regions_bedfile — the "Regions" BED; used only as HsMetrics
#                            TARGET_INTERVALS (for V6+UTR Agilent ships this
#                            identical to Covered).
probe_configs:
  SureSelectV6UTR:
    library_prep: "SureSelectV6UTR"
    covered_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V6UTR/S07604624_Covered.bed"
    target_regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V6UTR/S07604624_Regions.bed"
  SureSelectV8UTR:
    library_prep: "SureSelectV8UTR"
    covered_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V8UTR/S33613271_Covered.bed"
    target_regions_bedfile: "/mnt/data/NGS/refs/SureSelectHumanAllExon/V8UTR/S33613271_Regions.bed"

# Per job resources
resources:
  threads: 8
  java_max_gb: 32
  java_min_gb: 8

params:
  fastp:
    detect_adapter_for_pe: true
  bqsr:
    # Restrict BaseRecalibrator to the capture target (+padding). Must match the
    # calling pipeline's BQSR intervals for the PON normals to stay comparable.
    interval_padding: 100
  cnvkit:
    autobin:
      method: "hybrid"
      bp_per_bin: 100000
      target_min_size: 20
      target_max_size: 20000
      antitarget_min_size: 500
      antitarget_max_size: 500000

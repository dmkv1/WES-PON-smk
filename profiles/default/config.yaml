# Safe floor: 8 cores and 64 GB, small enough that a run started without a
# tuned profile does not starve a shared machine. 64 GB is the smallest budget
# that still admits the largest single job (a heavy GATK rule, 40 GB). For a
# real run, copy this directory to profiles/<name>/ (gitignored), raise cores,
# mem_mb and io_heavy together with the resources block in config.yaml, and
# launch with ./launch.sh --workflow-profile <name>.
cores: 8

# Memory budget, in MB. Rules that declare mem_mb are scheduled against this
# ceiling; without it the scheduler packs by cores alone and can start a
# full-size GATK job beside a samtools sort beside another GATK job.
#
# io_heavy caps the rules that read a whole BAM and write a whole BAM
# (mark_duplicates, apply_bqsr), which each declare io_heavy=1. Their memory
# tiers alone would let several run at once; on spinning disks concurrent
# whole-BAM rewrites turn into seek thrash rather than throughput. Raise it on
# NVMe, lower it on a single disk.
resources:
  mem_mb: 65536
  io_heavy: 2

# What a rule gets when it declares no mem_mb of its own: fastp, fastqc,
# mosdepth, cnvkit coverage. Small, but not free.
default-resources:
  mem_mb: 4000

use-conda: true
use-singularity: true
keep-going: true
rerun-incomplete: true
printshellcmds: true
